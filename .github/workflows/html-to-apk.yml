name: Build APK from HTML ZIP
on:
  workflow_dispatch:
    inputs:
      build_demo_if_missing:
        description: "Gerar um projeto de demonstração se input-project.zip ainda não existir"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - 'input-project.zip'
jobs:
  build-html-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create demo HTML project for pipeline test
        if: ${{ !hashFiles('input-project.zip') && github.event_name == 'workflow_dispatch' && inputs.build_demo_if_missing }}
        run: |
          python3 - <<'PY'
          import zipfile
          html = """<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>APK HTML de Teste</title>
            <style>
              * { box-sizing: border-box; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #f5f7ff; background: linear-gradient(145deg,#101320,#27345a); }
              main { max-width: 520px; width: 100%; padding: 28px; border-radius: 22px; background: #ffffff12; border: 1px solid #ffffff30; text-align: center; }
              button { border: 0; border-radius: 12px; padding: 14px 20px; font-size: 16px; font-weight: 700; background: #75e0b2; color: #122033; }
            </style>
          </head>
          <body><main><h1>APK HTML funcionando!</h1><p>Este aplicativo foi gerado pelo fluxo HTML → APK.</p><p id="count">Toques no botão: 0</p><button onclick="document.getElementById('count').textContent='Toques no botão: '+(++n)">Testar botão</button></main><script>let n=0;</script></body>
          </html>"""
          with zipfile.ZipFile("input-project.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("index.html", html)
          print("ZIP de demonstração criado para testar a geração de APK.")
          PY
      - name: Verify input project
        run: |
          if [ ! -f input-project.zip ]; then
            echo "::error::Envie um arquivo chamado input-project.zip para a raiz do repositório. A demonstração só é criada se você a habilitar explicitamente na execução manual."
            exit 1
          fi
      - name: Validate project archive
        run: |
          python3 - <<'PY'
          import os, zipfile
          path = 'input-project.zip'
          try:
              with zipfile.ZipFile(path) as z:
                  entries = z.infolist()
                  if not entries:
                      raise SystemExit('O ZIP está vazio.')
                  total = 0
                  found_index = False
                  for entry in entries:
                      name = entry.filename.replace('\\\\', '/')
                      if name.startswith('/') or any(part == '..' for part in name.split('/')):
                          raise SystemExit('Caminho inseguro no ZIP: ' + entry.filename)
                      if entry.flag_bits & 1:
                          raise SystemExit('ZIP protegido por senha não é aceito: ' + entry.filename)
                      total += entry.file_size
                      if os.path.basename(name).lower() == 'index.html':
                          found_index = True
                  if total > 200 * 1024 * 1024:
                      raise SystemExit('O projeto descompactado excede o limite de 200 MB.')
                  if not found_index:
                      raise SystemExit('Não encontrei index.html no ZIP. Inclua a página inicial e os recursos do projeto.')
                  bad = z.testzip()
                  if bad:
                      raise SystemExit('Arquivo corrompido dentro do ZIP: ' + bad)
                  print(f'ZIP válido: {len(entries)} entradas, {total} bytes descompactados.')
          except zipfile.BadZipFile:
              raise SystemExit('input-project.zip não é um ZIP válido.')
          PY
      - name: Extract web project safely
        run: |
          python3 - <<'PY'
          import os, zipfile, shutil
          archive = 'input-project.zip'
          dest = 'app/src/main/assets/site'
          if os.path.exists(dest):
              shutil.rmtree(dest)
          os.makedirs(dest, exist_ok=True)
          root = os.path.realpath(dest)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = os.path.realpath(os.path.join(dest, item.filename))
                  if target != root and not target.startswith(root + os.sep):
                      raise SystemExit('ZIP contém caminho inseguro: ' + item.filename)
                  if item.is_dir():
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with z.open(item) as src, open(target, 'wb') as out:
                          shutil.copyfileobj(src, out)
          candidates = []
          for base, dirs, files in os.walk(dest):
              if 'index.html' in files:
                  candidates.append(os.path.join(base, 'index.html'))
          if not candidates:
              raise SystemExit('Não encontrei index.html no ZIP.')
          chosen = candidates[0]
          if chosen != os.path.join(dest, 'index.html'):
              parent = os.path.dirname(chosen)
              for name in os.listdir(parent):
                  src = os.path.join(parent, name)
                  target = os.path.join(dest, name)
                  if os.path.exists(target):
                      if os.path.isdir(target): shutil.rmtree(target)
                      else: os.remove(target)
                  shutil.move(src, target)
          print('Projeto preparado em', dest)
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build project APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Conversor-HTML-Projeto.apk
      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-do-projeto-HTML
          path: Conversor-HTML-Projeto.apk
          if-no-files-found: error
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Conversão HTML → APK"
            echo ""
            if [ -f Conversor-HTML-Projeto.apk ]; then
              echo "✅ APK gerado: `Conversor-HTML-Projeto.apk`"
              echo "Baixe o artefato **APK-do-projeto-HTML** nesta execução."
            else
              echo "❌ A conversão não produziu um APK. Consulte a etapa marcada como falha nos logs."
            fi
            echo ""
            echo "O APK é um pacote de teste (debug). Projetos que dependam de serviços externos continuam precisando desses serviços."
          } >> "$GITHUB_STEP_SUMMARY"
